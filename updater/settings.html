<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThaiAsia Auto Update</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#1f2937;background:#f3f4f6}
    body{margin:0;padding:24px}.card{max-width:720px;margin:auto;background:white;border:1px solid #d1d5db;border-radius:12px;padding:24px;box-shadow:0 4px 16px #0001}
    h1{font-size:23px;margin:0 0 8px}.hint{color:#4b5563;line-height:1.45;margin:0 0 20px}
    label{display:block;font-weight:600;margin:16px 0 6px}input[type=text],input[type=password]{box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #9ca3af;border-radius:7px;font-size:15px}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{padding:10px 14px;border:0;border-radius:7px;background:#0f766e;color:white;font-weight:600;cursor:pointer}button.secondary{background:#374151}button.warn{background:#b45309}button:disabled{opacity:.55;cursor:wait}
    .check{display:flex;gap:9px;align-items:center;margin-top:16px}.check label{margin:0;font-weight:500}
    #status{margin-top:20px;padding:14px;border-radius:8px;background:#eff6ff;border:1px solid #bfdbfe;white-space:pre-wrap;line-height:1.45}.ok{color:#047857}.error{color:#b91c1c}.small{font-size:13px;color:#6b7280;margin-top:8px}
  </style>
</head>
<body>
  <main class="card">
    <h1>ThaiAsia Auto Update</h1>
    <p class="hint">Token chỉ được nhập trên máy này và được Windows DPAPI mã hóa. Cấp quyền <b>Contents: Read and write</b> cho đúng repository để cập nhật, gửi báo cáo và phản hồi Remote Control.</p>
    <label for="repository">GitHub repository</label>
    <input id="repository" type="text" autocomplete="off" placeholder="chinhthaiba/chinhthaiba-thaiasia-releases">
    <label for="token">Fine-grained token</label>
    <input id="token" type="password" autocomplete="new-password" placeholder="Để trống nếu không muốn thay token hiện tại">
    <div class="check"><input id="clearToken" type="checkbox"><label for="clearToken">Xóa token đang lưu</label></div>
    <div class="check"><input id="autoInstall" type="checkbox" checked><label for="autoInstall">Tự cài khi app không xử lý đơn liên tục 2 phút</label></div>
    <div class="row">
      <button id="save">Lưu cấu hình</button>
      <button id="check" class="secondary">Kiểm tra ngay</button>
      <button id="install" class="warn">Cài bản đã tải</button>
    </div>
    <div id="status">Đang đọc cấu hình…</div>
    <div class="small">App tự kiểm tra GitHub mỗi 10 phút. Draft và Pre-release không được tự cài.</div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    function render(s) {
      $('repository').value = s.repository || '';
      $('autoInstall').checked = s.autoInstall !== false;
      const lines = [
        `Phiên bản hiện tại: ${s.currentVersion || '?'}`,
        `Trạng thái: ${s.state || '?'}`,
        `GitHub token: ${s.hasToken ? 'đã lưu an toàn' : 'chưa cấu hình'}`,
        s.availableVersion ? `Phiên bản trên GitHub: ${s.availableVersion}` : '',
        s.message || ''
      ].filter(Boolean);
      $('status').textContent = lines.join('\n');
      $('status').className = s.state === 'error' ? 'error' : (s.state === 'up-to-date' ? 'ok' : '');
    }
    async function run(button, task) {
      button.disabled = true;
      try { render(await task()); }
      catch (error) { $('status').textContent = `Lỗi: ${error && error.message ? error.message : error}`; $('status').className = 'error'; }
      finally { button.disabled = false; }
    }
    $('save').addEventListener('click', () => run($('save'), async () => {
      const result = await window.thaiasiaUpdater.saveSettings({
        repository: $('repository').value.trim(), token: $('token').value.trim(),
        clearToken: $('clearToken').checked, autoInstall: $('autoInstall').checked
      });
      $('token').value = ''; $('clearToken').checked = false; return result;
    }));
    $('check').addEventListener('click', () => run($('check'), () => window.thaiasiaUpdater.checkNow()));
    $('install').addEventListener('click', () => run($('install'), () => window.thaiasiaUpdater.installNow()));
    window.thaiasiaUpdater.onStatus(render);
    window.addEventListener('DOMContentLoaded', () => window.thaiasiaUpdater.getSettings().then(render));
  </script>
</body>
</html>
